<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7A2E35">
  <meta name="description" content="حاضر - نظام تسجيل حضور فرقة القديس جاورجيوس الموسيقية">

  <title>حاضر | تسجيل الدخول</title>

  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preload" as="image" href="assets/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=block" rel="stylesheet">

  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">

  <noscript>
    <p class="noscript-note">هذه الصفحة تحتاج تفعيل جافاسكربت في المتصفح.</p>
  </noscript>

  <!-- الرأس العنابي -->
  <header class="login-hero">
    <div class="hero-rings" aria-hidden="true"></div>

    <div class="hero-content">
      <div class="logo-wrap">
        <img
          id="bandLogo"
          class="login-logo"
          src="assets/logo.png"
          alt="شعار فرقة القديس جاورجيوس الموسيقية"
          width="120" height="120"
          decoding="async">
      </div>

      <h1 class="login-title">حاضر</h1>

      <p class="login-subtitle">
        <span class="login-divider" aria-hidden="true"></span>
        <span>فرقة القديس جاورجيوس الموسيقية</span>
        <span class="login-divider" aria-hidden="true"></span>
      </p>
    </div>
  </header>

  <main class="login-main">

    <section class="login-card" aria-labelledby="cardTitle">

      <h2 id="cardTitle" class="card-title">تسجيل الدخول</h2>
      <p class="card-sub">أدخل كلمة السر للمتابعة</p>

      <form id="loginForm" novalidate>

        <div class="form-group">

          <label for="passwordField" class="login-label">كلمة السر</label>

          <div class="field">

            <span class="login-key-icon" aria-hidden="true">
              <span class="material-symbols-outlined">key</span>
            </span>

            <input
              id="passwordField"
              name="band_password"
              type="password"
              class="login-input"
              autocomplete="current-password"
              placeholder="أدخل كلمة السر"
              required
              maxlength="256"
              enterkeyhint="go"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              aria-describedby="errorMsg">

            <button
              id="togglePasswordBtn"
              type="button"
              class="login-toggle-password"
              aria-label="إظهار كلمة السر"
              aria-pressed="false">
              <span class="material-symbols-outlined" id="eyeIcon">visibility</span>
            </button>

          </div>

          <div id="errorMsg" class="auth-notice error" role="alert" hidden>
            <span class="material-symbols-outlined" aria-hidden="true">error</span>
            <p id="errorText">يرجى إدخال كلمة السر.</p>
          </div>

          <div id="loginNotice" class="auth-notice info" role="status" aria-live="polite" hidden>
            <p id="loginNoticeText"></p>
          </div>

        </div>

        <button id="submitBtn" type="submit" class="login-button">
          <span id="submitBtnText">دخول</span>
          <span id="submitBtnIcon" class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
        </button>

      </form>

    </section>

    <p class="login-footer">نظام تسجيل حضور فرقة القديس جاورجيوس الموسيقية</p>

    <p class="login-security-note">
      <span class="material-symbols-outlined" aria-hidden="true">lock</span>
      <span>تسجيل دخول آمن للمراقب وصاحب النظام</span>
    </p>

  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
